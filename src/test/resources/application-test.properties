spring.application.name=P2P-Shopping
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.cache.CacheAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

spring.mongodb.repositories.enabled=false
spring.data.redis.repositories.enabled=false
spring.data.mongodb.uri=mongodb://localhost:27017/unused
spring.data.redis.host=localhost
spring.cache.type=none
telemetry.raw-ping-import.enabled=false

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# AI Config Default Tests
ai.api.key=test-key
ai.api.url=https://api.test.com
ai.model=gpt-4
ai.provider=gemini

# Security
jwt.secret=test-secret-key-care-trebuie-sa-fie-foarte-lunga-32-chars

# Disable scheduling during tests
app.scheduling.enabled=false
spring.task.scheduling.pool.size=1
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=15