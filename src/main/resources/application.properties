spring.application.name=P2P-Shopping
server.port=8081
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:p2p_shopping}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
jwt.secret=${JWT_SECRET:defaultDevSecretKeyThatIsAtLeast32BytesLong!!}
ai.api.key=${AI_API_KEY:${GEMINI_API_KEY:}}
ai.api.url=${AI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent}
ai.model=${AI_MODEL:gemini-3.1-flash-lite}
ai.provider=${AI_PROVIDER:gemini}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/p2p_shopping}
telemetry.api.key=${TELEMETRY_API_KEY:default-telemetry-key}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://ucart-smoky.vercel.app}
app.scheduling.enabled=true
app.security.cookie-secure-flag=${COOKIE_SECURE_FLAG:true}

routing.recalculation.cooldown=${ROUTING_RECALCULATION_COOLDOWN:PT1M}
routing.recalculation.guard.max-size=${ROUTING_RECALCULATION_GUARD_MAX_SIZE:10000}
data-decay.enabled=${DATA_DECAY_ENABLED:true}
data-decay.cron=${DATA_DECAY_CRON:0 0 3 * * ?}
data-decay.zone=${DATA_DECAY_ZONE:UTC}
data-decay.penalty=${DATA_DECAY_PENALTY:0.02}
data-decay.cutoff-days=${DATA_DECAY_CUTOFF_DAYS:14}
data-decay.min-confidence-floor=${DATA_DECAY_MIN_CONFIDENCE_FLOOR:0.15}

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# Public OSRM demo endpoint is for light/demo use only.
# Plan for self-hosted OSRM or managed provider for production.
osrm.base-url=${OSRM_BASE_URL:https://router.project-osrm.org}

# Telemetry data retention
telemetry.cleanup.cron=0 0 0 * * *
telemetry.cleanup.retention-days=7

catalog.store-price.retention-cron=${CATALOG_STORE_PRICE_RETENTION_CRON:0 0 2 * * *}
catalog.store-price.retention-zone=${CATALOG_STORE_PRICE_RETENTION_ZONE:UTC}
catalog.store-price.retention-days=${CATALOG_STORE_PRICE_RETENTION_DAYS:30}
catalog.population.cron=${CATALOG_POPULATION_CRON:0 0 3 * * *}
catalog.population.zone=${CATALOG_POPULATION_ZONE:UTC}
catalog.population.min-distinct-users=${CATALOG_POPULATION_MIN_DISTINCT_USERS:3}

# Telemetry deduplication
telemetry.dedup.window-seconds=60

# Telemetry Mongo -> PostGIS raw ping import
telemetry.raw-ping-import.fallback-mongo-uri=${TELEMETRY_FALLBACK_MONGO_URI:mongodb://localhost:27017/p2p_shopping_mongo}
telemetry.raw-ping-import.enabled=${TELEMETRY_RAW_PING_IMPORT_ENABLED:true}
telemetry.raw-ping-import.fixed-delay-ms=${TELEMETRY_RAW_PING_IMPORT_FIXED_DELAY_MS:30000}
telemetry.raw-ping-import.batch-size=${TELEMETRY_RAW_PING_IMPORT_BATCH_SIZE:500}
telemetry.raw-ping-import.auto-provision-dimensions=${TELEMETRY_RAW_PING_IMPORT_AUTO_PROVISION_DIMENSIONS:true}

# Proximity matching
proximity.radius.meters=500
proximity.debounce.hours=24

# Firebase Admin SDK
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:firebase-service-account.json}
